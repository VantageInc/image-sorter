name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Expected package version on master; packages without publishing
        required: true
        default: 1.1.0
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v' + p.version) { throw new Error('Tag and package version differ') }"

      - name: Verify release source
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Manual release validation must run from master." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          test -f ".github/release-notes/${RELEASE_TAG}.md"

      - name: Install locked dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check

      - name: Audit runtime and registry provenance
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit signatures

      - name: Build application bundles
        run: npm run build:app

      - name: Generate source SBOM
        run: npm sbom --sbom-format cyclonedx > Image-Sorter-${{ env.RELEASE_TAG }}-Source-SBOM.cdx.json

      - name: Upload source SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sorter-source-sbom
          path: Image-Sorter-${{ env.RELEASE_TAG }}-Source-SBOM.cdx.json
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Package Windows x64
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke-test packaged Windows app
        run: npm run smoke:packaged

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sorter-windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Package macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            script: dist:mac:x64
          - runner: macos-15
            arch: arm64
            script: dist:mac:arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke-test packaged macOS app
        run: npm run smoke:packaged

      - name: Upload macOS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-sorter-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs:
      - validate
      - windows
      - macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-sorter-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt

      - name: Attest release provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: artifacts/*

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: .github/release-notes/${{ env.RELEASE_TAG }}.md
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          tag_name: ${{ env.RELEASE_TAG }}
